# Local development: `docker compose up -d mysql` starts only the database (run the API and Vite yourself).
# Full stack:       `docker compose --profile app up -d --build` also builds and runs the combined app image.
# Copy .env.example to .env first and set real passwords. Never commit .env.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-antique_store}
      MYSQL_USER: ${MYSQL_USER:-antique_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      Database__Provider: MySql
      ConnectionStrings__Default: "server=mysql;port=3306;database=${MYSQL_DATABASE:-antique_store};user=${MYSQL_USER:-antique_app};password=${MYSQL_PASSWORD}"
      Database__ApplyMigrationsOnStartup: "true"
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
      Firebase__CredentialsJson: ${FIREBASE_CREDENTIALS_JSON:-}
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__CloudinaryCloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Storage__CloudinaryApiKey: ${CLOUDINARY_API_KEY:-}
      Storage__CloudinaryApiSecret: ${CLOUDINARY_API_SECRET:-}
      Seo__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Behind your own TLS-terminating reverse proxy, also set ReverseProxy__TrustAllProxies=true.
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
      - private-files:/app/App_Data

volumes:
  mysql-data:
  uploads:
  private-files:
